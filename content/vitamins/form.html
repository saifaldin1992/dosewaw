<div class="grid">

      <label class="chk"><input type="checkbox" id="med"><span><span data-t="med">أدوية تقلل فيتامين D</span><small data-t="med_s">مثل مضادات الصرع والكورتيكوستيرويدات وأدوية HIV</small></span></label>
